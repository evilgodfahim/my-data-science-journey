name: Generate PDF

# This allows you to run the workflow manually from the Actions tab
on: 
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository code so the runner can access pdf.py
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install the required reportlab library
      - name: Install dependencies
        run: pip install reportlab

      # Step 4: Run your Python script
      - name: Run pdf.py
        run: python pdf.py

      # Step 5: Upload the generated PDF so you can download it
      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generated-PDF
          # This grabs any PDF file created in the main directory
          path: '*.pdf'