name: Migrate Byparr to Trawl

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests pynacl

      - name: Run migration
        env:
          GITHUB_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          WEBSHARE_PROXY_URL: ${{ secrets.WEBSHARE_PROXY_URL }}
        run: python3 migrate_all.py --apply
